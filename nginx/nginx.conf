server {
    listen       80;
    server_name  _;                # 没有域名用 _ 即可，通过 IP 直接访问

    # ---------- 上传体积上限 ----------
    # Nginx 默认仅允许 1MB，而后端视频接口上限为 300MB。
    # 不开这一项，通过 Nginx 调上传接口会被直接拒绝（413），
    # 但本地直连 9300 端口却正常 —— 典型的「本地好使、线上不行」故障。
    client_max_body_size 500m;

    # ---------- 前端静态文件 ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # Vue/React SPA history 模式必须
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass         http://tuyou-api:9300;   # docker 内部网络，用容器名
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;  # SSE 事件及时送达
        proxy_cache off;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        access_log off;
    }
}
