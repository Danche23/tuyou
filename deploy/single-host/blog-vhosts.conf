server {
    listen 80;
    server_name tuyou.evenstar.love admin.evenstar.love;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tuyou.evenstar.love;
    ssl_certificate /etc/nginx/ssl/tuyou.evenstar.love.pem;
    ssl_certificate_key /etc/nginx/ssl/tuyou.evenstar.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 320m;

    location / {
        proxy_pass http://tuyou-h5:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.evenstar.love;
    ssl_certificate /etc/nginx/ssl/tuyou.evenstar.love.pem;
    ssl_certificate_key /etc/nginx/ssl/tuyou.evenstar.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 320m;

    location / {
        proxy_pass http://tuyou-h5:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
