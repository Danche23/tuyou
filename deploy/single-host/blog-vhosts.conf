server {
    listen 80;
    server_name tuyou.evenstar.love admin.evenstar.love;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tuyou.evenstar.love;
    ssl_certificate /etc/nginx/ssl/tuyou.evenstar.love.pem;
    ssl_certificate_key /etc/nginx/ssl/tuyou.evenstar.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 320m;

    # SSE 经过两层代理，每层都必须关闭缓冲；内层的 X-Accel-Buffering 默认不会透传。
    location /api/ {
        proxy_pass http://tuyou-h5:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location / {
        proxy_pass http://tuyou-h5:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.evenstar.love;
    ssl_certificate /etc/nginx/ssl/tuyou.evenstar.love.pem;
    ssl_certificate_key /etc/nginx/ssl/tuyou.evenstar.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 320m;

    location /api/ {
        proxy_pass http://tuyou-h5:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header Cache-Control "no-cache" always;
    }

    location ~* "\.[0-9a-f]{8}\.(?:async\.js|chunk\.css|js|css|png|jpe?g|webp|gif|svg|woff2?)$" {
        proxy_pass http://tuyou-h5:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://tuyou-h5:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache" always;
    }
}
