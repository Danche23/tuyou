server {
    listen 8080;
    server_name _;
    root /srv/tuyou/web/current;
    index index.html;
    client_max_body_size 320m;

    location /api/ {
        proxy_pass http://api:9300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://api:9300;
    }

    location /editorial/ {
        alias /srv/tuyou/web/editorial/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;
    root /srv/tuyou/admin/current;
    index index.html;
    client_max_body_size 320m;

    location ^~ /api/ {
        proxy_pass http://api:9300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://api:9300;
    }

    location ~* "\.[0-9a-f]{8}\.(?:async\.js|chunk\.css|js|css|png|jpe?g|webp|gif|svg|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
